name: CI

# Halotani Shop is one standalone store repository. CI verifies source only;
# production deployment remains an explicit operator action documented in
# RELEASE.md and is never implied by a green push.

on:
  push:
    branches:
      - main
      - install/halotanishop
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and static analysis
        run: npm run check

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build
